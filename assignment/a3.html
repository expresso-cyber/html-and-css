<!DOCTYPE html>
<html lang="en">

<head>
    <title>Assignment 1 - CSS</title>
    <link rel="stylesheet" href="a3.css">
</head>

<body>

    <div class="container">
        <div class="form">
            <img src="images/user.svg" class="icon" alt="Username">
            <input type="text" placeholder="Username" class="input-field" autofocus>
        </div>
        
        <div class="form">
            <img src="images/pass.svg" class="icon" alt="Password">
            <input type="password" placeholder="Password" class="input-field">
        </div>
        
        <h1>Location</h1>
        
        <div class="address-row">
            <img src="images/location.svg" class="location-icon" alt="Location">
            <textarea placeholder="Address....." class="address"></textarea>
        </div>
        
        <button class="submit-btn">
            <img src="images/submit.svg" alt="Submit">
            Submit
        </button>
    </div>

</body>

</html>
